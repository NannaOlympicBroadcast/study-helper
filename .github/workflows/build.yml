name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Embed GitHub OAuth client id (optional)
        shell: bash
        env:
          CLIENT_ID: ${{ secrets.STUDY_HELPER_GITHUB_CLIENT_ID }}
        run: |
          if [ -n "$CLIENT_ID" ]; then echo "{\"clientId\":\"$CLIENT_ID\"}" > assets/oauth.json; fi
      - name: Build Windows installer + portable exe
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: StudyHelper-windows
          path: |
            release/StudyHelper-Setup-*.exe
            release/StudyHelper-Portable-*.exe

  mcpb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run pack:mcpb
      - uses: actions/upload-artifact@v4
        with:
          name: study-helper-mcpb
          path: release/*.mcpb

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, mcpb]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
